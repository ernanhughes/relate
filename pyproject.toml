[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relate-search"
version = "0.1.0"
description = "Relation-aware search over frozen embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ernan Hughes" }]
dependencies = [
    "numpy>=1.26",
    "typing-extensions>=4.10; python_version < '3.11'",
]

[project.urls]
Homepage = "https://programmer.ie/solutions/relate/"
Repository = "https://github.com/ernanhughes/relate"
Documentation = "https://github.com/ernanhughes/relate/blob/main/docs/reference-map.md"
"Embeddings From First Principles" = "https://programmer.ie/books/embeddings-from-first-principles/"
"Programmer.ie Article" = "https://programmer.ie/post/relate/"
"Live Demo" = "https://huggingface.co/spaces/ernanhughes/relate-demo"

[project.optional-dependencies]
replay = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "scikit-learn>=1.4"]

[project.scripts]
relate = "relate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
