[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relate-search"
version = "0.1.0"
description = "Relation-aware search over frozen embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ernan Hughes" }]
dependencies = [
    "numpy>=1.26",
    "typing-extensions>=4.10; python_version < '3.11'",
]

[project.optional-dependencies]
replay = ["scikit-learn>=1.4"]
dev = ["pytest>=8", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
